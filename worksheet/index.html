<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 나라는 이야기 | 온라인 활동지</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f1;color:#233b34;font:16px/1.65 system-ui,'Malgun Gothic',sans-serif}main{max-width:820px;margin:auto;padding:24px 18px 60px}header{padding:28px;background:#23483e;color:white;border-radius:20px}h1{font-size:clamp(26px,5vw,38px);margin:8px 0}h2{margin:0 0 8px;font-size:24px}p{margin:8px 0 16px}.muted,small{color:#586c62}header small{color:#d6e4db}.panel{background:white;border:1px solid #dce4dc;border-radius:18px;padding:24px;margin-top:18px}label{display:block;font-weight:650;margin-top:18px}input[type=text],textarea,select{width:100%;padding:12px;border:1px solid #abbdb1;border-radius:9px;font:inherit;background:white;color:#233b34;margin:6px 0}textarea{min-height:85px;resize:vertical}button{font:inherit;font-weight:650;cursor:pointer;padding:10px 18px;border:1px solid #34614e;border-radius:10px;background:#34614e;color:white}button.secondary{background:white;color:#34614e}button:disabled{opacity:.4;cursor:default}nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}nav button{font-size:13px;padding:6px 10px;background:white;color:#34614e}nav button.active{background:#34614e;color:white}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:20px}.hint{background:#eef4e9;border-radius:10px;padding:12px;font-size:14px}.choice{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:8px 0;padding:8px;border:1px solid #e0e8df;border-radius:8px}.choice input{margin-top:6px;accent-color:#34614e}.sub{border-top:1px solid #e1e7df;margin-top:20px;padding-top:12px}progress{width:100%;accent-color:#34614e;height:12px}#output{min-height:330px;font-size:14px} [hidden]{display:none!important}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #bc8b37;outline-offset:2px}</style></head><body><main><header><small>솔올중학교 · 자주적 진로탐색 동아리</small><h1>2026, 나라는 이야기</h1><div>나의 1년을 돌아보고, 나만의 웹페이지를 만들어요.</div></header><p class="muted">정답은 없어요. 예시를 참고해 한두 문장씩 적어 보세요. 기억나지 않거나 공개하고 싶지 않은 내용은 건너뛰어도 됩니다. 실명 대신 별명을 사용하세요.</p><div id="status" role="status" class="muted"></div><progress id="progress" max="8" value="1"></progress><nav id="nav" aria-label="활동 단계"></nav><div id="pages"></div><div class="actions"><button class="secondary" id="prev">이전</button><button id="next">다음</button></div><div class="actions"><button class="secondary" id="save">작성 내용 파일 저장</button><button class="secondary" id="reset">전체 초기화</button></div><small>작성 내용은 이 브라우저에 자동 저장을 시도합니다. 공용 PC에서는 작업을 마친 뒤 초기화하세요. 파일 저장 버튼으로 별도 백업할 수 있습니다.</small></main><script>
const titles=['지금의 나','1년의 기록','동아리 활동','작품 전시관','성장 이야기','미래의 나','디자인 선택','프롬프트 완성'];
const lessons=['4/1 스마트교통시스템 이해 / 마퀸 기본주행','4/22 마퀸 차동 조향 장치 코딩','5/20 장애물 회피 주행','6/10 라인트레이서','6/24 무선조종 자율주행자동차','7/8 무선조종 자율주행자동차 2','7/15 1학기 다시 돌아보기 (ITS, 자율주행)','8/26 말 한마디로 게임 만들기','9/2 AI야 내 취향 좀 맞춰봐','9/9 내가 만든 웹사이트, 인터넷에 공개해보기','9/23 나만의 클릭커 게임 만들기','10/7 우리 학교를 바꾸는 작은 서비스 1','10/14 우리 학교를 바꾸는 작은 서비스 2','10/21 우리 학교를 바꾸는 작은 서비스 3','11/11 나의 관심사 추천앱 만들기'];
let data={};try{data=JSON.parse(localStorage.getItem('solol2026worksheet')||'{}')||{}}catch(e){}let step=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(k,label,ex,short=false){return `<label for="${k}">${label}</label><small>예시: ${esc(ex)}</small>${short?`<input type="text" id="${k}" data-key="${k}" value="${esc(data[k])}" placeholder="나의 답변">`:`<textarea id="${k}" data-key="${k}" placeholder="나의 답변">${esc(data[k])}</textarea>`}`}
function choices(k,opts,multi=false){return opts.map((v,i)=>`<label class="choice"><input type="${multi?'checkbox':'radio'}" name="${k}" data-key="${k}" value="${esc(v)}" ${(multi?(data[k]||[]).includes(v):data[k]===v)?'checked':''}>${esc(v)}</label>`).join('')}
const head=(n,desc)=>`<h2>${n+1}. ${titles[n]}</h2><p class="muted">${desc}</p>`;
function render(){ $('nav').innerHTML=titles.map((t,i)=>`<button class="${i===step?'active':''}" data-step="${i}">${i+1} ${t}</button>`).join('');$('status').textContent=`${step+1} / 8 단계 · ${titles[step]}`;$('progress').value=step+1;$('prev').disabled=step===0;$('next').hidden=step===7;let h='';switch(step){
case 0:h=head(0,'지금의 나를 소개하는 프로필을 만들어 봐요.')+field('nickname','웹페이지에서 사용할 별명','코딩탐험가',true)+field('keywords','나를 표현하는 단어 3개','호기심, 게임, 끈기',true)+field('likes','좋아하는 것과 요즘 관심 있는 것','농구, 게임 제작, 우주 이야기')+field('strength','내가 잘하거나 즐겁게 하는 일','친구에게 게임 방법 설명하기')+field('intro','나를 소개하는 한 문장','새로운 게임을 만들고 친구들과 함께 즐기는 것을 좋아한다.');break;
case 1:h=head(1,'동아리뿐 아니라 학교생활과 일상에서 기억에 남는 순간을 찾아봐요.')+'<div class="hint">체육대회, 친구, 여행, 취미, 시험, 발표, 가족과의 시간, 작은 성공 등 무엇이든 좋아요. 2~3개만 골라 작성해도 됩니다.</div>'+['가장 즐거웠던 순간','새롭게 도전한 일','기억에 남거나 뿌듯했던 일'].map((t,i)=>`<div class="sub"><strong>${t}</strong>`+field('time'+i,'언제, 어떤 일이 있었나요?','5월 체육대회에서 친구들과 이어달리기를 했다.',true)+field('memory'+i,'왜 기억에 남나요?','함께 연습해서 끝까지 달린 것이 뿌듯했다.')+'</div>').join('');break;
case 2:h=head(2,'올해 동아리에서 기억에 남는 활동을 최대 3개 골라 봐요.')+choices('lessons',lessons,true)+'<div id="reflections"></div>';break;
case 3:h=head(3,'내가 만든 것 또는 이루어낸 일을 소개해요. 동아리 밖의 활동도 좋아요.')+'<div class="hint">자율주행 자동차, 클릭커 게임, 학교 서비스, 추천앱, 그림, 글, 운동 기록 등. 작품 파일이나 링크가 없어도 설명만으로 소개할 수 있어요.</div>'+[0,1].map(i=>`<div class="sub"><strong>작품 또는 성취 ${i+1}${i?' (선택)':''}</strong>`+field('project'+i,'이름','우리 학교 급식 추천 서비스',true)+field('purpose'+i,'무엇을 만들었고 왜 만들었나요?','친구들이 급식 메뉴를 쉽게 볼 수 있도록 만들었다.')+field('feature'+i,'특징 또는 가장 마음에 드는 부분','버튼을 누르면 메뉴가 나타난다.')+field('fix'+i,'어려웠던 점이나 해결한 방법','버튼이 작동하지 않아 AI에게 오류를 설명하고 고쳤다.')+field('link'+i,'공개 가능한 작품 주소 (선택)','https://... (없으면 비워 두기)',true)+'</div>').join('');break;
case 4:h=head(4,'작은 변화도 성장입니다. 자신에게 해당하는 영역을 골라요.')+choices('growthTags',['창의력','문제 해결력','디지털 활용 능력','소통과 협력','도전과 끈기','자신감','자기 이해'],true)+field('before','올해 초의 나는?','코딩이 어렵게 느껴져 혼자 만들 자신이 없었다.')+field('after','지금의 나는?','AI에게 원하는 기능을 설명하고 수정할 수 있게 되었다.')+field('evidence','그렇게 생각하는 이유나 실제 경험은?','클릭커 게임 오류를 여러 번 수정해 완성했다.');break;
case 5:h=head(5,'직업을 꼭 정할 필요는 없어요. 앞으로 해보고 싶은 것을 생각해 봐요.')+field('interest','더 알아보고 싶은 분야나 직업 (선택)','게임 개발, 디자인, 자동차, 아직 탐색 중')+field('learn','앞으로 더 배우고 싶은 것','친구와 함께 할 수 있는 게임 만들기')+field('goals','2027년에 도전하고 싶은 일 (1~3개)','웹사이트 하나 완성하기 / 운동 꾸준히 하기 / 새로운 취미 찾기')+field('letter','미래의 나에게 보내는 한마디','실패해도 다시 시도하고 좋아하는 것을 계속 찾아가자!');break;
case 6:h=head(6,'나를 잘 표현할 웹페이지의 분위기와 기능을 선택해요.')+'<label>원하는 디자인</label>'+choices('style',['깔끔한 포트폴리오형','게임 캐릭터 프로필형','감성 다이어리형','미래 탐험형','나만의 스타일'])+field('colors','좋아하는 색상 또는 원하는 분위기','남색과 보라색, 우주 느낌',true)+'<label>추가하고 싶은 기능 (복수 선택)</label>'+choices('features',['메뉴 클릭 시 이동','다크모드 전환','타임라인 애니메이션','작품 상세 설명 열기','미래의 나에게 보내는 편지 열기'],true)+field('extra','나만의 추가 아이디어 (선택)','올해의 BEST 3 카드, 나의 취향 모음');break;
case 7:h=head(7,'아래 프롬프트를 복사해 바이브코딩에 사용할 AI에게 전달하세요.')+'<div class="hint">작성하지 않은 내용은 AI가 지어내지 않도록 요청합니다. 복사하기 전 개인정보가 없는지 확인하세요.</div><label for="output">나의 포트폴리오 제작 프롬프트</label><textarea id="output" readonly></textarea><div class="actions"><button id="copy">프롬프트 복사</button><button class="secondary" id="download">프롬프트 TXT 저장</button></div><p id="feedback" role="status"></p><div class="hint">제작 후 확인: 내 내용이 정확한가? 메뉴와 버튼이 작동하는가? 휴대폰에서도 잘 보이는가? 수정하고 싶은 부분은 무엇인가?</div>';break;}
$('pages').innerHTML=`<section class="panel">${h}</section>`;if(step===2)reflect();if(step===7){$('output').value=promptText();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('feedback').textContent='복사했습니다.'}catch(e){$('output').select();$('feedback').textContent='선택된 내용을 Ctrl+C로 복사하세요.'}};$('download').onclick=()=>download(promptText(),'2026_portfolio_prompt.txt');}}
function reflect(){const el=$('reflections');if(!el)return;el.innerHTML=(data.lessons||[]).map(v=>{let i=lessons.indexOf(v);return `<div class="sub"><strong>${esc(v)}</strong>`+field('why'+i,'왜 기억에 남았나요?','자동차가 스스로 장애물을 피하는 것이 신기했다.')+field('learn'+i,'무엇을 배웠거나 느꼈나요?','센서 값에 따라 자동차의 움직임을 바꿀 수 있었다.')+'</div>'}).join('')}
function persist(){try{localStorage.setItem('solol2026worksheet',JSON.stringify(data))}catch(e){}}
$('pages').addEventListener('input',e=>{let x=e.target,k=x.dataset.key;if(!k)return;if(x.type==='checkbox'){let a=data[k]||[];if(x.checked&&k==='lessons'&&a.length>=3){x.checked=false;alert('최대 3개까지 선택할 수 있어요.');return}data[k]=x.checked?[...a,x.value]:a.filter(v=>v!==x.value);if(k==='lessons')reflect()}else data[k]=x.value;persist()});
function go(i){step=Math.max(0,Math.min(7,i));render();window.scrollTo({top:0,behavior:'smooth'})}$('nav').onclick=e=>{if(e.target.dataset.step!==undefined)go(+e.target.dataset.step)};$('prev').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);
function promptText(){let lines=['나의 2026년 성장 포트폴리오 웹페이지를 만들어 줘. HTML, CSS, JavaScript를 하나의 HTML 파일로 작성해 줘. 모바일에서도 보기 좋게 만들고 메뉴와 기능이 실제로 작동하도록 해 줘. 아래 학생이 작성한 내용만 사용하고, 비어 있는 항목은 생략해 줘. 사실이나 작품 링크를 지어내지 말고 개인정보를 추가하지 마.'];const add=(label,k)=>{let v=data[k];if(Array.isArray(v))v=v.join(', ');if(v&&String(v).trim())lines.push(label+': '+v)};const section=t=>lines.push('\n['+t+']');section('지금의 나');[['별명','nickname'],['키워드','keywords'],['관심사','likes'],['강점','strength'],['소개','intro']].forEach(a=>add(...a));section('1년의 기록');for(let i=0;i<3;i++){add(['즐거웠던 순간','도전','기억에 남는 일'][i],'time'+i);add('의미','memory'+i)}section('동아리 활동');lines.push('솔올중 자주적 진로탐색 동아리 전체 수업 목록(공통 참고 자료):\n'+lessons.join('\n'));for(const v of data.lessons||[]){lines.push('내가 선택한 활동: '+v);let i=lessons.indexOf(v);add('기억에 남는 이유','why'+i);add('배운 점','learn'+i)}section('작품 전시관');for(let i=0;i<2;i++){add('작품 이름','project'+i);add('제작 이유','purpose'+i);add('특징','feature'+i);add('어려움과 해결','fix'+i);add('작품 링크','link'+i)}section('성장 이야기');[['성장 영역','growthTags'],['올해 초','before'],['지금','after'],['실제 경험','evidence']].forEach(a=>add(...a));section('미래의 나');[['관심 분야','interest'],['더 배우고 싶은 것','learn'],['2027년 목표','goals'],['미래의 나에게','letter']].forEach(a=>add(...a));section('디자인과 기능');[['디자인','style'],['색상과 분위기','colors'],['기능','features'],['추가 아이디어','extra']].forEach(a=>add(...a));lines.push('\n학생의 경험과 공통 수업 목록을 구별하고, 입력하지 않은 개인 경험을 만들어 내지 마. 외부 이미지 없이도 보기 좋도록 구성하고 작품 링크는 제공된 안전한 http/https 주소만 사용해 줘.');return lines.join('\n')}
function download(content,name){const u=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('save').onclick=()=>download(promptText(),'2026_my_answers.txt');$('reset').onclick=()=>{if(confirm('모든 작성 내용을 지울까요? 저장하지 않은 답변은 복구할 수 없습니다.')){data={};persist();go(0)}};render();</script></body></html>
